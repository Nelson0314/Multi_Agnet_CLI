<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' file:" />
    <title>Multi-Agent CLI</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand"><img src="../../assets/icon-256.png" alt="" /><span>multi-agent</span></div>
      <button id="projectBtn" class="project-btn"><span id="projectName"></span><span class="caret">▾</span></button>
      <div class="spacer"></div>
      <button id="dashBtn" class="ghost" data-i18n="top.dashboard"></button>
      <button id="accountBtn" class="account-btn"><span class="avatar" id="accountAvatar"></span><span id="accountName"></span><span class="caret">▾</span></button>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <div class="side-actions">
          <button id="newClaude" data-i18n="side.newClaude"></button>
          <button id="newCodex" data-i18n="side.newCodex"></button>
          <button id="newShell" class="shell-btn"></button>
        </div>
        <input id="search" type="search" data-i18n-placeholder="side.search" />
        <div class="tabs">
          <button class="tab active" data-tab="claude">Claude <span id="countClaude"></span></button>
          <button class="tab" data-tab="codex">Codex <span id="countCodex"></span></button>
          <button id="refreshList" class="icon refresh-btn" data-i18n-title="side.refresh">↻</button>
        </div>
        <ul id="sessionList" class="session-list"></ul>
        <div class="side-foot" id="paneCount"></div>
      </aside>

      <main id="workspaces">
        <div id="empty" class="empty">
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n="empty.body"></p>
          <button id="emptyPick" class="primary" data-i18n="empty.pick"></button>
          <ul id="recentList" class="recent-list"></ul>
        </div>
      </main>

      <aside id="dashboard" hidden>
        <h3 data-i18n="dash.usage"></h3>
        <div id="dashUsage"></div>
        <h3 data-i18n="dash.context"></h3>
        <div id="dashContext"></div>
        <h3 data-i18n="dash.appearance"></h3>
        <div id="dashAppearance" class="settings"></div>
        <h3 data-i18n="dash.settings"></h3>
        <div id="dashSettings" class="settings"></div>
      </aside>
    </div>

    <div id="popover" class="popover" hidden></div>
    <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
    <div id="toasts" class="toasts"></div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="themes.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
